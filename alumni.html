<!doctype html>
<html lang="en">

<head>
  <meta name="view-transition" content="same-origin">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMVL Lab — Alumni</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/navbar.css">
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/scroll-reveal.css">
  <link rel="stylesheet" href="./assets/css/back-to-top.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --page-bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.7);
      --muted: #64748b;
      --accent: #4f46e5;
      --border: rgba(255, 255, 255, 0.6);
      --card-border-light: rgba(255, 255, 255, 0.8);
      --text: #0f172a;
      --nav-h: 72px;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1e293b;
      padding-top: var(--nav-h);
      line-height: 1.55;
    }

    h1, h2, h3, .page-title, .section-title {
      font-family: 'Outfit', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.12), transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.12), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.12), transparent 50%);
      background-color: #f8fafc;
      z-index: -1;
      animation: breathe 15s alternate infinite ease-in-out;
    }

    @keyframes breathe {
      0%   { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .container-max {
      max-width: 1100px;
      width: 90%;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .page-head {
      margin: 28px 0 22px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 900;
      margin: 0;
    }

    .page-subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    .section-title {
      font-weight: 900;
      font-size: 19px;
      margin: 32px 0 14px;
      border-left: 5px solid var(--accent);
      padding-left: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-count {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(79, 70, 229, 0.08);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .section-count.is-empty {
      color: var(--muted);
      background: rgba(100, 116, 139, 0.10);
    }

    /* Alumni card grid */
    .alumni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .alumni-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border-light);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: 0.22s ease;
    }

    .alumni-card:hover {
      transform: translateY(-4px);
      border-color: rgba(79, 70, 229, 0.5);
      box-shadow: 0 16px 32px rgba(79, 70, 229, 0.10);
    }

    .alumni-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #0f172a;
      margin: 0 0 4px;
    }

    .alumni-degree {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #3730a3;
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.18);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 8px;
    }

    .alumni-year {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .alumni-thesis {
      font-size: 13px;
      color: #374151;
      margin-bottom: 10px;
      line-height: 1.45;
    }

    /* Sponsoring grant — project fellows only */
    .alumni-funding {
      font-size: 12px;
      font-weight: 600;
      color: #4338ca;
      margin-bottom: 6px;
    }

    .alumni-position {
      font-size: 12.5px;
      color: var(--muted);
      font-style: italic;
    }

    .alumni-icons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .alumni-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(79, 70, 229, 0.07);
      border: 1px solid rgba(79, 70, 229, 0.15);
      transition: 0.18s ease;
    }

    .alumni-icons a:hover {
      background: rgba(79, 70, 229, 0.15);
      border-color: rgba(79, 70, 229, 0.4);
    }

    .alumni-icons svg {
      width: 15px;
      height: 15px;
      fill: var(--accent);
    }

    /* Btech alumni grid */
    .btech-alumni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .btech-alumni-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border-light);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      transition: 0.22s ease;
    }

    .btech-alumni-cell:hover {
      transform: translateY(-3px);
      border-color: rgba(79, 70, 229, 0.45);
      box-shadow: 0 12px 26px rgba(79,70,229,0.09);
    }

    .btech-alumni-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
    }

    .btech-alumni-dept {
      font-size: 12px;
      font-weight: 600;
      color: #3730a3;
      background: rgba(79, 70, 229, 0.08);
      border-radius: 6px;
      padding: 2px 8px;
      align-self: flex-start;
    }

    .btech-alumni-project {
      font-size: 12.5px;
      color: #374151;
      line-height: 1.4;
    }

    .btech-alumni-year {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      stroke: #c7d2fe;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 15px;
      margin: 0;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 8px;
    }

    .back-link:hover { text-decoration: underline; }

    /* Page fade */
    #app-content {
      animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUpIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    html { overflow-y: scroll; }
    @view-transition { navigation: auto; }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div id="navbar">
    <nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="./index.html">
          <img src="./assets/images/logo/1000371724-removebg-preview.png" alt="MMVL Logo"
            style="height:80px; width:auto; margin-right:10px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
          aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"><span></span></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
            <li class="nav-item"><a class="nav-link" href="research.html">Research</a></li>
            <li class="nav-item"><a class="nav-link" href="facilities.html">Facilities</a></li>
            <li class="nav-item"><a class="nav-link" href="publications.html">Publications</a></li>
            <li class="nav-item"><a class="nav-link" href="joinus.html">Join Us</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </div>

  <main id="app-content">
    <div class="container-max">

      <a href="team.html" class="back-link">
        <svg style="width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Back to Team
      </a>

      <div class="page-head" data-reveal>
        <h1 class="page-title">Alumni</h1>
        <div class="page-subtitle">
          Former members of the Machine &amp; Medical Vision Lab (MMVL) — where are they now?
        </div>
      </div>

      <!-- 1. PhD Alumni -->
      <div class="section-title" data-reveal>
        PhD Fellows <span class="section-count" id="phdAlumniCount"></span>
      </div>
      <div class="alumni-grid" id="phdAlumniGrid"></div>

      <!-- 2. Project Alumni -->
      <div class="section-title" data-reveal>
        Project Fellows <span class="section-count" id="projectAlumniCount"></span>
      </div>
      <div class="alumni-grid" id="projectAlumniGrid"></div>

      <!-- 3. Masters Alumni -->
      <div class="section-title" data-reveal>
        Masters <span class="section-count" id="mastersAlumniCount"></span>
      </div>
      <div class="alumni-grid" id="mastersAlumniGrid"></div>

      <!-- 4. Bachelors Alumni -->
      <div class="section-title" data-reveal>
        Bachelors<span class="section-count" id="btechAlumniCount"></span>
      </div>
      <div id="btechAlumniGrid"></div>

    </div>

    <!-- Data + renderer (inside #app-content so the SPA router re-executes them) -->
    <script src="./data/team-data.js"></script>
    <script src="./data/alumni-data.js"></script>
    <script src="./loaders/alumni-load.js"></script>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./assets/js/footer-load.js"></script>

  <script src="./assets/js/scroll-reveal.js"></script>
  <script src="./assets/js/back-to-top.js"></script>
  <script src="./assets/js/spa.js"></script>
</body>

</html>
